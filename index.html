<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gym Log" />
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root{
      --bg:#0c0c0c; --bg-2:#141414; --card:#171717; --card-2:#1c1c1c;
      --line:#242424; --text:#f4f4f5; --muted:#9a9a9a; --accent:#FFD400;
      --warn:#ff6b3d; --blue:#7ec8ff; --radius:16px;
      --safe-b:env(safe-area-inset-bottom, 0px);
      --safe-t:env(safe-area-inset-top, 0px);
      --nav-h:56px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    .app{max-width:520px;margin:0 auto;min-height:100dvh}
    header.top{position:sticky;top:0;z-index:20;background:#0c0c0c;padding:calc(6px + var(--safe-t)) 16px 6px;display:flex;align-items:center;min-height:0}
    .sub,#dateLabel{display:none !important}
    .brand{display:flex;align-items:center;gap:8px;margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
    .brand .mark{width:12px;height:12px;background:var(--accent);border-radius:3px;flex:0 0 12px}
    .unit-label,#unitBtn,#installBtn,#homeInstall,[data-act='repeat-last'],#view-home [data-act='start-fresh']{display:none !important}
    .view{display:none;padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 20px)}
    .view.active{display:block}
    #view-home.active:not(.ready){visibility:hidden}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#0c0c0c;border-top:1px solid #1a1a1a;padding:4px 8px calc(6px + var(--safe-b));z-index:30;min-height:calc(var(--nav-h) + var(--safe-b))}
    .nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;min-height:40px}
    .nav button span{display:none;font-size:10px;font-weight:600}
    .nav button.active{color:var(--text)}
    .nav button.active span{display:block}
    .nav button.active svg{color:var(--accent)}
    .nav svg{width:20px;height:20px}
    .card{background:var(--card);border:0;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
    .row{display:flex;gap:8px;align-items:center}
    .space{justify-content:space-between}
    .grow{flex:1;min-width:0}
    .tiny{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
    .btn{background:var(--accent);color:#111;font-weight:700;border-radius:14px;padding:12px 14px;width:100%;min-height:44px;letter-spacing:-.01em}
    .btn.ghost{background:var(--card-2);color:var(--text)}
    .btn.warn{background:transparent;color:var(--warn)}
    .btn.sm{padding:8px 12px;width:auto;font-size:13px;border-radius:10px;min-height:44px}
    .btn.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:10px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:10px 0 14px}
    .chip{flex:0 0 auto;border:0;background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--muted);font-weight:500;min-height:44px}
    .chip.on{background:var(--accent);color:#111;font-weight:700}
    input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4a4300}
    textarea{min-height:72px;resize:vertical}
    .ex-name{font-weight:650;letter-spacing:-.02em}
    .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:#232323;color:var(--muted);font-weight:600}
    .tag.db{color:var(--blue);background:#15202a}
    .tag.mc{color:#111;background:var(--accent)}
    .set-grid{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center;margin-top:8px}
    .set-grid input{text-align:center;padding:9px 6px;min-height:44px;font-size:16px}
    .set-grid button{min-height:44px;min-width:44px}
    .done{opacity:.5}
    .timer-overlay{display:none;position:fixed;inset:0;z-index:50;background:#000c;align-items:center;justify-content:center;padding:24px}
    .timer-overlay.show{display:flex}
    .timer-box{width:min(360px,100%);background:var(--card);border-radius:24px;padding:28px 20px;text-align:center}
    .clock{font-size:clamp(56px,18vw,84px);line-height:1;color:var(--accent);font-weight:700;letter-spacing:-.04em}
    .clock.warn{color:var(--warn)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0 8px;align-items:stretch}
    .stat{text-align:center;background:var(--card);border-radius:12px;padding:8px 4px;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .stat b{display:block;font-size:16px;line-height:1.1;color:var(--text);letter-spacing:-.04em;font-weight:700}
    .stat .tiny{margin-top:2px;font-size:10px;line-height:1.2;height:12px;overflow:hidden;white-space:nowrap;max-width:100%}
    .stat-accent{background:#1d1a0a}
    .stat-accent b{color:var(--accent)}
    .bar{height:5px;background:#232323;border-radius:99px;overflow:hidden;margin-top:6px}
    .bar>i{display:block;height:100%;background:var(--accent)}
    .vol-row{margin-top:10px}
    .strip{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px;color:var(--muted);font-size:13px}
    .text-link{color:var(--text);font-size:13px;font-weight:600;background:none;width:auto;padding:0;min-height:0}
    .text-link.muted{color:var(--muted);font-weight:500}
    .empty{text-align:center;color:var(--muted);padding:26px 12px;line-height:1.45}
    .modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:40;align-items:flex-end;justify-content:center}
    .modal-bg.show{display:flex}
    .sheet{width:100%;max-width:520px;background:#161616;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:88dvh;overflow:auto}
    .grab{width:42px;height:4px;background:#3a3a3a;border-radius:99px;margin:0 auto 14px}
    @media (min-width:800px){
      .app{max-width:880px}
      .nav{max-width:880px}
      #view-progress.active{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
      #view-progress > :first-child{grid-column:1 / -1}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><i class="mark"></i>Gym Log</div>
      <div id="dateLabel" hidden></div>
      <button type="button" id="installBtn" hidden>Install</button>
      <div id="unitBtn" hidden>kg</div>
    </header>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-library"></section>
    <section class="view" id="view-workout"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-progress"></section>
  </div>
  <nav class="nav">
    <button type="button" class="active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg><span>Home</span></button>
    <button type="button" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg><span>Gear</span></button>
    <button type="button" data-view="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Train</span></button>
    <button type="button" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Log</span></button>
    <button type="button" data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V6M10 18V10M16 18V8M22 18H2"/></svg><span>PRs</span></button>
  </nav>
  <div class="timer-overlay" id="timer">
    <div class="timer-box">
      <div class="tiny">Rest</div>
      <div class="clock" id="clock">1:30</div>
      <div class="row" style="justify-content:center;gap:8px;margin:12px 0">
        <button class="btn sm ghost" type="button" data-act="timer-adj" data-d="-15">-15</button>
        <button class="btn sm ghost" type="button" data-act="timer-adj" data-d="15">+15</button>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" type="button" data-act="timer-skip">Skip</button>
        <button class="btn" type="button" data-act="timer-skip">Done</button>
      </div>
    </div>
  </div>
  <div class="modal-bg" id="modal"><div class="sheet" id="sheet"></div></div>
  <script src="suggest.js" defer></script>
  <script src="app.js" defer></script>
  <script src="extra.js" defer></script>
  <script src="more.js" defer></script>
  <script src="cues.js" defer></script>
  <script src="backup.js" defer></script>
  <script src="homeui.js" defer></script>
</body>
</html>
