<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gym Log" />
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0c0c0c; --bg-2:#141414; --card:#171717; --card-2:#1c1c1c;
      --line:#2a2a2a; --text:#f4f4f5; --muted:#9a9a9a; --accent:#FFD400;
      --warn:#ff6b3d; --blue:#7ec8ff; --radius:18px;
      --safe-b:env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif}
    body{padding-bottom:calc(120px + var(--safe-b));-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    .app{max-width:520px;margin:0 auto;min-height:100%}
    header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0c0c0c 72%,transparent);padding:16px 18px 12px;display:flex;align-items:flex-end;justify-content:space-between}
    .sub{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
    .brand{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
    .brand .mark{width:18px;height:18px;background:var(--accent);border-radius:5px;flex:0 0 18px}
    .unit-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:8px 10px}
    .view{display:none;padding:6px 16px calc(96px + var(--safe-b))}
    .view.active{display:block}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#101010f5;border-top:1px solid var(--line);padding:10px 8px calc(10px + var(--safe-b));z-index:30}
    .nav button{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .nav button.active{color:var(--text)}
    .nav button.active svg{color:var(--accent)}
    .nav svg{width:22px;height:22px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .row{display:flex;gap:8px;align-items:center}
    .space{justify-content:space-between}
    .grow{flex:1;min-width:0}
    .tiny{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
    .btn{background:var(--accent);color:#111;font-weight:700;border-radius:14px;padding:13px 14px;width:100%;letter-spacing:-.01em}
    .btn.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--line)}
    .btn.warn{background:transparent;color:var(--warn);border:1px solid #3a2018}
    .btn.sm{padding:8px 12px;width:auto;font-size:13px;border-radius:10px}
    .btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:10px 0 14px}
    .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--muted);font-weight:500}
    .chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
    input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4a4300}
    textarea{min-height:72px;resize:vertical}
    .ex-name{font-weight:650;letter-spacing:-.02em}
    .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:#232323;color:var(--muted);font-weight:600}
    .tag.db{color:var(--blue);background:#15202a}
    .tag.mc{color:#111;background:var(--accent)}
    .set-grid{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px}
    .set-grid input{text-align:center;padding:9px 6px}
    .done{opacity:.5}
    .timer-overlay{display:none;position:fixed;inset:0;z-index:50;background:#000c;align-items:center;justify-content:center;padding:24px}
    .timer-overlay.show{display:flex}
    .timer-box{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center}
    .clock{font-size:84px;line-height:1;color:var(--accent);font-weight:700;letter-spacing:-.04em}
    .clock.warn{color:var(--warn)}
    .stat{text-align:center}
    .stat b{display:block;font-size:28px;color:var(--text);letter-spacing:-.04em;font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
    .bar{height:6px;background:#232323;border-radius:99px;overflow:hidden;margin-top:8px}
    .bar>i{display:block;height:100%;background:var(--accent)}
    .empty{text-align:center;color:var(--muted);padding:26px 12px;line-height:1.45}
    .modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:40;align-items:flex-end;justify-content:center}
    .modal-bg.show{display:flex}
    .sheet{width:100%;max-width:520px;background:#161616;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:88vh;overflow:auto}
    .grab{width:42px;height:4px;background:#3a3a3a;border-radius:99px;margin:0 auto 14px}
    .install-banner{display:none}
    .install-banner.show{display:block}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div class="sub" id="dateLabel"></div>
        <div class="brand"><i class="mark"></i>Gym Log</div>
      </div>
      <div class="row">
        <button class="btn sm ghost" type="button" id="installBtn" style="display:none">Install</button>
        <div class="unit-label" id="unitBtn">KG</div>
      </div>
    </header>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-library"></section>
    <section class="view" id="view-workout"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-progress"></section>
  </div>
  <nav class="nav">
    <button type="button" class="active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg>Home</button>
    <button type="button" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>Gear</button>
    <button type="button" data-view="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Train</button>
    <button type="button" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Log</button>
    <button type="button" data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V6M10 18V10M16 18V8M22 18H2"/></svg>PRs</button>
  </nav>
  <div class="timer-overlay" id="timer">
    <div class="timer-box">
      <div class="tiny">Rest</div>
      <div class="clock" id="clock">1:30</div>
      <div class="row" style="justify-content:center;gap:8px;margin:12px 0">
        <button class="btn sm ghost" type="button" data-act="timer-adj" data-d="-15">-15</button>
        <button class="btn sm ghost" type="button" data-act="timer-adj" data-d="15">+15</button>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" type="button" data-act="timer-skip">Skip</button>
        <button class="btn" type="button" data-act="timer-skip">Done</button>
      </div>
    </div>
  </div>
  <div class="modal-bg" id="modal"><div class="sheet" id="sheet"></div></div>
  <script src="suggest.js"></script>
  <script src="app.js"></script>
  <script src="extra.js"></script>
  <script src="more.js"></script>
  <script src="cues.js"></script>
</body>
</html>
