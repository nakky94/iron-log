<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
</head>
<body style="background:#0a0a0a;color:#f4f4f5;font-family:system-ui">
  <script src="boot.js"></script>
  <p id="bootNote" style="padding:24px">Gym Log</p>
  <script>
    fetch("index.html").then(function (r) { return r.text(); }).then(function (html) {
      if (html.indexOf("view-home") === -1) return;
      document.open();
      document.write(html.replace("<body>", "<body><script src=\"boot.js\"><\\/script>"));
      document.close();
    });
  </script>
</body>
</html>
