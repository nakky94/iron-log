<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gym Log" />
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root{--bg:#0a0a0a;--bg-2:#141414;--card:#141414;--card-2:#1c1c1c;--line:#222;--text:#f4f4f5;--muted:#8d8d8d;--accent:#FFD400;--warn:#ff6b3d;--radius:18px;--safe-b:env(safe-area-inset-bottom, 0px);--safe-t:env(safe-area-inset-top, 0px);--nav-h:62px;}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    .app{max-width:520px;margin:0 auto;min-height:100dvh}
    header.top{position:sticky;top:0;z-index:20;background:#0a0a0a;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;border-bottom:1px solid #161616}
    .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.02em}
    .brand .mark{width:12px;height:12px;background:var(--accent);border-radius:3px}
    #dateLabel,#installBtn,#homeInstall,[data-act='repeat-last'],#view-home [data-act='start-fresh']{display:none !important}
    .view{display:none;padding:8px 16px calc(var(--nav-h) + var(--safe-b) + 20px)}
    .view.active{display:block}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#0a0a0a;border-top:1px solid #161616;padding:6px 6px calc(8px + var(--safe-b));z-index:30;gap:4px}
    .nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6e6e6e;font-size:10px;font-weight:600;min-height:48px;border-radius:16px;padding:6px 2px;position:relative}
    .nav button span{display:block;margin-top:2px}
    .nav button.active{color:#111;background:#FFD400;font-weight:800}
    .nav button.active svg{color:#111;fill:#111;stroke:#111}
    .nav svg{width:20px;height:20px}
    .card{background:var(--card);border:1px solid #1e1e1e;border-radius:var(--radius);padding:14px;margin-bottom:10px;text-align:left;position:relative}
    .row{display:flex;gap:8px;align-items:center}
    .space{justify-content:space-between}
    .grow{flex:1;min-width:0}
    .tiny{font-size:11px;color:var(--muted);font-weight:500}
    .btn{background:var(--accent);color:#111;font-weight:700;border-radius:14px;padding:12px 14px;width:100%;min-height:44px}
    .btn.ghost{background:var(--card-2);color:var(--text)}
    .btn.warn{background:transparent;color:var(--warn)}
    .btn.sm{width:auto;padding:8px 12px;min-height:40px}
    .chip{flex:0 0 auto;background:#161616;border:1px solid #222;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);min-height:36px}
    .chip.on{background:var(--accent);color:#111;font-weight:700}
    .chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .chips::-webkit-scrollbar{display:none}
    input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
    .ex-name{font-weight:700;text-align:left;letter-spacing:-.02em}
    .set-grid{display:grid;grid-template-columns:24px 70px 1fr 70px 44px;gap:6px;align-items:center;margin-top:8px}
    .set-grid input{text-align:center;padding:8px 4px;min-height:44px;font-size:16px}
    .step-wrap{display:flex;align-items:center;gap:3px;min-width:0}
    .step-wrap input{flex:1;min-width:0}
    .step{width:44px;height:44px;border-radius:10px;background:#1c1c1c;font-weight:800}
    .ghost-set{display:none}
    .timer-overlay{display:none !important}
    .sess-strip{display:flex;flex-wrap:wrap;justify-content:space-between;padding:6px 2px 10px;color:var(--muted);font-size:12px;font-weight:600;position:sticky;top:calc(44px + var(--safe-t));background:var(--bg);z-index:8}
    .text-link{color:var(--text);font-size:13px;font-weight:600}
    .modal-bg{display:none;position:fixed;inset:0;background:#000a;z-index:40;align-items:flex-end;justify-content:center}
    .modal-bg.show{display:flex}
    .sheet{width:100%;max-width:520px;background:#161616;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:88dvh;overflow:auto}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}
    .stat{text-align:center;background:var(--card);border:1px solid #1e1e1e;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;gap:4px;min-height:68px;justify-content:center}
    .stat b{font-size:18px;font-variant-numeric:tabular-nums}
    .stat .tiny{font-size:9px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
    .stat-accent{background:#19160a;border-color:#2a2610}
    .stat-accent b{color:var(--accent)}
    .set-grid [data-act='toggle-set']{width:44px;height:44px;border-radius:12px;font-weight:800;background:#1c1c1c;border:1px solid #333}
    .set-grid [data-act='toggle-set']:not(.ghost){background:var(--accent);color:#111;border-color:var(--accent)}
    #prToast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%);background:var(--accent);color:#111;font-weight:800;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;z-index:60}
    #prToast.show{opacity:1}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><i class="mark"></i>Gym Log</div>
      <div id="dateLabel" hidden></div>
      <button type="button" id="installBtn" hidden>Install</button>
      <div id="unitBtn" hidden>kg</div>
    </header>
    <section class="view active ready" id="view-home"></section>
    <section class="view" id="view-library"></section>
    <section class="view" id="view-workout"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-progress"></section>
  </div>
  <nav class="nav">
    <button type="button" class="active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg><span>Home</span></button>
    <button type="button" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg><span>Gear</span></button>
    <button type="button" data-view="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Train</span></button>
    <button type="button" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Log</span></button>
    <button type="button" data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V6M10 18V10M16 18V8M22 18H2"/></svg><span>PRs</span></button>
  </nav>
  <div class="timer-overlay" id="timer"></div>
  <div class="modal-bg" id="modal"><div class="sheet" id="sheet"></div></div>
  <script src="perf.js"></script>
  <script src="suggest.js" defer></script>
  <script src="app.js" defer></script>
  <script src="extra.js" defer></script>
  <script src="more.js" defer></script>
  <script src="cues.js" defer></script>
  <script src="backup.js" defer></script>
  <script src="homeui.js" defer></script>
  <script src="trainsets.js" defer></script>
  <script src="restfix.js" defer></script>
  <script src="volume.js" defer></script>
  <script src="plus.js" defer></script>
  <script src="typefix.js" defer></script>
  <script src="restctl.js" defer></script>
  <script src="layout.js" defer></script>
  <script src="pro.js" defer></script>
  <script src="mobile.js" defer></script>
  <script src="history.js" defer></script>
  <script src="prs.js" defer></script>
  <script src="charts.js" defer></script>
  <script src="gear.js" defer></script>
  <script src="timers.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="continue.js" defer></script>
  <script src="units.js" defer></script>
</body>
</html>
